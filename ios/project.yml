name: Atrani
options:
  bundleIdPrefix: it.cinereo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(ATRANI_DEVELOPMENT_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Atrani:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Atrani
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: it.cinereo.atrani
            CFBundleURLSchemes: [atrani]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.it.cinereo.atrani]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cinereo.atrani
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AtraniWidget
  AtraniWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Ближайшие заезды
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.it.cinereo.atrani]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.cinereo.atrani.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Atrani:
    build:
      targets:
        Atrani: all
    run:
      config: Debug
    archive:
      config: Release
