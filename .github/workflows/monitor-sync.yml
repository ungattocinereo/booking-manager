name: monitor-sync

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [monitor/nuove-prenotazioni]
    paths:
      - "monitor-app/**"
      - ".github/workflows/monitor-sync.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/monitor/nuove-prenotazioni' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
      artifact_id: ${{ steps.upload-pages.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: monitor/nuove-prenotazioni
          fetch-depth: 1
          persist-credentials: true

      - name: Check out production sync source
        uses: actions/checkout@v7
        with:
          ref: main
          path: booking-manager-source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install deps
        working-directory: monitor-app
        run: npm install --no-audit --no-fund

      - name: Install booking sync dependencies
        working-directory: booking-manager-source
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Sync production booking calendars
        working-directory: booking-manager-source
        env:
          NODE_ENV: production
          POSTGRES_URL: ${{ secrets.BOOKING_MANAGER_POSTGRES_URL }}
          ICAL_URLS: ${{ secrets.BOOKING_MANAGER_ICAL_URLS }}
        run: npm run sync

      - name: Run sync
        working-directory: monitor-app
        env:
          UPSTREAM_API: https://b.amalfi.day/api/bookings
          SINCE: "2026-04-17"
          BOOKING_MANAGER_CF_ACCESS_CLIENT_ID: ${{ secrets.BOOKING_MANAGER_CF_ACCESS_CLIENT_ID }}
          BOOKING_MANAGER_CF_ACCESS_CLIENT_SECRET: ${{ secrets.BOOKING_MANAGER_CF_ACCESS_CLIENT_SECRET }}
        run: npm run sync

      - name: Commit data changes
        run: |
          git config user.name "monitor-sync-bot"
          git config user.email "actions@github.com"
          git add monitor-app/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: auto-sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin monitor/nuove-prenotazioni
          fi

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: upload-pages
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: monitor-app

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ needs.sync.outputs.artifact_id }}
          PAGES_BUILD_VERSION: ${{ needs.sync.outputs.head_sha }}
        with:
          retries: 3
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            const buildVersion = process.env.PAGES_BUILD_VERSION;

            if (!artifactId) {
              throw new Error('Missing Pages artifact id from upload-pages-artifact');
            }
            if (!buildVersion) {
              throw new Error('Missing monitor branch HEAD SHA');
            }

            const oidcToken = await core.getIDToken();
            const deployment = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
              pages_build_version: buildVersion,
              oidc_token: oidcToken,
            });

            const deploymentId = deployment.data.id;
            const initialPageUrl = deployment.data.page_url || 'https://ungattocinereo.github.io/booking-manager/';
            core.info(`Created Pages deployment ${deploymentId} for ${buildVersion}`);

            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 5000));

              const status = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                deploymentId,
              });

              const deploymentStatus = status.data.status;
              core.info(`Pages deployment status: ${deploymentStatus}`);

              if (deploymentStatus === 'succeed') {
                core.setOutput('page_url', status.data.page_url || initialPageUrl);
                return;
              }

              const finalErrorStatuses = [
                'deployment_failed',
                'deployment_perms_error',
                'deployment_content_failed',
                'deployment_cancelled',
                'deployment_lost',
              ];
              if (finalErrorStatuses.includes(deploymentStatus)) {
                throw new Error(`Pages deployment failed with status ${deploymentStatus}`);
              }
            }

            throw new Error('Timed out waiting for Pages deployment');
