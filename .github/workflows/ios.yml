name: ios

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test booking and Rome calendar logic
        working-directory: ios
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build application and large widget for iPhone Simulator
        working-directory: ios
        run: >-
          xcodebuild -project Atrani.xcodeproj -scheme Atrani
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify iPhone bundle metadata
        working-directory: ios
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('DerivedData/Build/Products/Debug-iphonesimulator/Atrani.app')
          versions = []
          for bundle in [app, app / 'PlugIns/AtraniWidget.appex']:
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              assert info['UIDeviceFamily'] == [1], f'{bundle.name} must target iPhone only'
              versions.append((info['CFBundleShortVersionString'], info['CFBundleVersion']))
          assert versions[0] == versions[1], 'App and widget versions must match'
          print('App and widget metadata match the iPhone distribution contract')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Atrani-iPhone-Simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/Atrani.app
          retention-days: 7
